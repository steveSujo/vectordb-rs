[package]
name = "vdb"
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
memmap2 = "0.5"
sha2 = "0.10"
rand = "0.8"
proptest = "1.0"
quickcheck = "1.0"
ndarray = "0.15"
aes-gcm = "0.10"
argon2 = "0.5"
rayon = "1.8"
bytemuck = { version = "1.14", features = ["derive"] }

[dev-dependencies]
criterion = "0.4"
tempfile = "3.3"

[[bench]]
name = "vdb_bench"
harness = false


